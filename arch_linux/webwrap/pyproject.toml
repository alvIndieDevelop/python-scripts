[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webwrap"
version = "0.3.0"
description = "Manage Chromium web applications on Linux"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "alvIndieDevelop" }]
dependencies = []

[project.scripts]
webwrap = "webwrap.main:main"
webwrap-gui = "webwrap.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
